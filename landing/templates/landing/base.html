<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Roomora - Find Your Perfect Home{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="icon" href="{% static 'landing/images/logo-black.png' %}" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="{% static 'landing/css/main.css' %}">
    <style>
        /* Fallback critical styling if main.css fails to load */
        body { background: #080808; color: #F8FAFC; font-family: 'Plus Jakarta Sans', Inter, sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .btn { display: inline-block; padding: 8px 12px; border-radius: 8px; text-decoration: none; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body{% block extra_body_attr %}{% endblock %}>
    {% block content %}{% endblock %}
    
    <!-- Notification Toast Container -->
    <div id="notification-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <script src="{% static 'landing/js/accordion.js' %}"></script>
    
    {% if user.is_authenticated %}
    <script>
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const notificationSocket = new WebSocket(
            wsScheme + '://' + window.location.host + '/ws/notifications/'
        );

        notificationSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            showNotification(data.title, data.message, data.type);
        };

        notificationSocket.onclose = function(e) {
            console.error('Notification socket closed unexpectedly');
        };

        function showNotification(title, message, type) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.style.cssText = `
                background: white;
                border-left: 4px solid #3B82F6;
                padding: 16px;
                border-radius: 8px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
                width: 300px;
                transform: translateX(100%);
                opacity: 0;
                transition: all 0.3s ease;
            `;
            
            if (type === 'SYSTEM' || type === 'CONFLICT') {
                toast.style.borderLeftColor = '#EF4444';
            } else if (type === 'MATCH_FOUND' || type === 'PAYMENT') {
                toast.style.borderLeftColor = '#10B981';
            }
            
            toast.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div>
                        <h4 style="margin: 0 0 4px 0; font-size: 14px; color: #111827;">${title}</h4>
                        <p style="margin: 0; font-size: 13px; color: #4B5563;">${message}</p>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" style="background: none; border: none; cursor: pointer; color: #9CA3AF; padding: 0;">×</button>
                </div>
            `;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => {
                toast.style.transform = 'translateX(0)';
                toast.style.opacity = '1';
            }, 10);
            
            // Auto dismiss
            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }
    </script>
    {% endif %}
    <script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function toggleSaveCard(propertyId, event, btnElement) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        
        if (!btnElement) return;
        const svg = btnElement.querySelector('svg');
        const csrfToken = getCookie('csrftoken') || '';
        
        fetch('/properties/save/' + propertyId + '/', {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'Accept': 'application/json',
                'X-CSRFToken': csrfToken
            }
        })
        .then(response => {
            if (response.status === 401 || response.status === 403 || response.redirected) {
                window.location.href = '/accounts/login/?next=' + encodeURIComponent(window.location.pathname);
                return null;
            }
            return response.json();
        })
        .then(data => {
            if (!data) return;
            if (data.success) {
                if (data.is_saved) {
                    btnElement.classList.add('save-active');
                    if (svg) {
                        svg.setAttribute('fill', '#ef4444');
                        svg.setAttribute('stroke', '#ef4444');
                    }
                    btnElement.style.transform = 'scale(1.25)';
                    setTimeout(() => { btnElement.style.transform = ''; }, 200);
                } else {
                    btnElement.classList.remove('save-active');
                    if (svg) {
                        svg.setAttribute('fill', 'none');
                        svg.setAttribute('stroke', 'currentColor');
                    }
                }
                if (typeof showNotification === 'function') {
                    showNotification('Favorites', data.message, data.is_saved ? 'MATCH_FOUND' : 'SYSTEM');
                }
            }
        })
        .catch(err => {
            console.error('Error saving property:', err);
        });
    }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
