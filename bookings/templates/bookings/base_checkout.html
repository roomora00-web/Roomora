<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Roomora">
    <title>{% block title %}Roomora - Secure Checkout{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="{% static 'pwa/icons/apple-touch-icon.png' %}">
    <link rel="icon" href="{% static 'pwa/icons/favicon-32.png' %}" type="image/png" sizes="32x32">
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            background: #F4F4F6;
            color: #111111;
            font-family: 'Plus Jakarta Sans', Inter, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .font-outfit { font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; }

        .glass-card {
            background: #FFFFFF;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 12px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px -10px rgba(0, 0, 0, 0.08), 0 6px 16px -4px rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.12);
        }

        .ds-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 28px;
            border: none;
            border-radius: 100px;
            background: #111111;
            color: #FFFFFF;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ds-btn:hover {
            transform: translateY(-2px);
            background: #252525;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.96); }
        }
        .animate-pulse-subtle { animation: pulse-subtle 2.5s infinite ease-in-out; }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .pulse-emerald { animation: pulse-ring 2s infinite; }

        input[type="date"], select, textarea, input[type="text"], input[type="email"] {
            background: #FFFFFF;
            color: #111111;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 16px;
            padding: 14px 18px;
            width: 100%;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #111111;
            box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="font-sans min-h-screen flex flex-col bg-[#F4F4F6] text-[#111111]">
    <nav class="flex items-center justify-between px-6 sm:px-12 py-4 border-b border-black/[0.06] bg-white/90 backdrop-blur-md sticky top-0 z-50">
        <a href="{% url 'landing:home' %}" class="font-outfit font-extrabold text-[24px] text-[#111111] no-underline tracking-tight flex items-center gap-2.5">
            <div class="h-8 w-8 rounded-xl bg-[#111111] text-white flex items-center justify-center font-extrabold text-sm shadow-sm">R</div>
            <span>Roomora</span>
        </a>
        <div class="flex items-center gap-2.5 text-[13px] text-[#555555] font-semibold bg-[#F4F4F6] px-4 py-2 rounded-full border border-black/[0.06]">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span>Secure Checkout</span>
        </div>
    </nav>
    <main class="flex-1 flex flex-col relative z-0">
        {% if messages %}
        <div id="globalToastContainer" class="fixed top-20 right-4 sm:right-8 z-[9999] max-w-md w-full space-y-3 pointer-events-none">
            {% for message in messages %}
            <div class="toast-item pointer-events-auto flex items-start justify-between gap-3 p-4 rounded-2xl border shadow-xl backdrop-blur-md transition-all duration-500 transform translate-x-0 opacity-100 {% if message.tags == 'error' %}bg-rose-50/95 border-rose-300 text-rose-950{% elif message.tags == 'warning' %}bg-amber-50/95 border-amber-300 text-amber-950{% else %}bg-emerald-50/95 border-emerald-300 text-emerald-950{% endif %}">
                <div class="flex items-start gap-3">
                    <div class="h-6 w-6 rounded-full flex items-center justify-center shrink-0 mt-0.5 shadow-xs {% if message.tags == 'error' %}bg-rose-600 text-white{% elif message.tags == 'warning' %}bg-amber-600 text-white{% else %}bg-emerald-600 text-white{% endif %}">
                        {% if message.tags == 'error' %}
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        {% else %}
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                        {% endif %}
                    </div>
                    <div class="text-xs sm:text-sm font-bold leading-relaxed">
                        {{ message }}
                    </div>
                </div>
                <button type="button" onclick="dismissToast(this.parentElement)" class="text-gray-400 hover:text-gray-700 font-bold text-base leading-none p-1">✕</button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script>
        function dismissToast(el) {
            if (!el) return;
            el.classList.add('opacity-0', 'translate-x-8');
            setTimeout(() => { el.remove(); }, 400);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const toasts = document.querySelectorAll('.toast-item');
            if (toasts.length > 0) {
                setTimeout(() => {
                    toasts.forEach(t => dismissToast(t));
                }, 5000);
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/serviceworker.js', { scope: '/' })
                    .then(function(reg) {
                        console.log('[Roomora PWA] SW registered:', reg.scope);
                    })
                    .catch(function(err) {
                        console.warn('[Roomora PWA] SW failed:', err);
                    });
            });
        }
    </script>
    <script src="{% static 'pwa/js/mobile-enhancements.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
