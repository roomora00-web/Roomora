<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Roomora - Secure Checkout{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="icon" href="{% static 'landing/images/logo-black.png' %}" type="image/png" sizes="32x32">
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            background: #050505;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', Inter, sans-serif;
        }
        .glass-card {
            background: rgba(20, 20, 20, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        }
        .glass-header {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .ds-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            background: #ffffff;
            color: #000000;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(255,255,255,0.16);
            transition: all 0.2s ease;
        }
        .ds-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 34px rgba(255,255,255,0.2);
        }
        input[type="date"], select, textarea, input[type="text"], input[type="email"] {
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 16px;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ffffff;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="font-sans min-h-screen flex flex-col bg-[#050505] text-white">
    <nav class="flex items-center justify-between px-5 sm:px-10 py-4 sm:py-6 border-b border-white/10 bg-[#080808]/80 backdrop-blur-md sticky top-0 z-50">
        <a href="{% url 'landing:home' %}" class="font-extrabold text-[22px] text-white no-underline tracking-tight">Roomora</a>
        <div class="flex items-center gap-2 text-[13px] text-slate-400 font-semibold">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Secure Checkout
        </div>
    </nav>
    <main class="flex-1 flex flex-col relative z-0">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
