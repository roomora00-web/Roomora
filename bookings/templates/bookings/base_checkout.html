<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Roomora - Secure Checkout{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="icon" href="{% static 'landing/images/logo-black.png' %}" type="image/png" sizes="32x32">
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            background: #F5F5F5;
            color: #111111;
            font-family: 'Plus Jakarta Sans', Inter, sans-serif;
        }
        .glass-card {
            background: #FFFFFF;
            border: 1px solid rgba(0, 0, 0, 0.07);
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        .ds-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 100px;
            background: #111111;
            color: #FFFFFF;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }
        .ds-btn:hover {
            transform: translateY(-1px);
            background: #222222;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        input[type="date"], select, textarea, input[type="text"], input[type="email"] {
            background: #FFFFFF;
            color: #111111;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 14px;
            padding: 14px 16px;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #111111;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="font-sans min-h-screen flex flex-col bg-[#F5F5F5] text-[#111111]">
    <nav class="flex items-center justify-between px-6 sm:px-12 py-4 border-b border-black/5 bg-white/90 backdrop-blur-md sticky top-0 z-50">
        <a href="{% url 'landing:home' %}" class="font-extrabold text-[22px] text-[#111111] no-underline tracking-tight flex items-center gap-2">
            <span>Roomora</span>
        </a>
        <div class="flex items-center gap-2 text-[13px] text-[#555555] font-semibold bg-[#F5F5F5] px-4 py-1.5 rounded-full border border-black/5">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-600"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Secure Checkout
        </div>
    </nav>
    <main class="flex-1 flex flex-col relative z-0">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
