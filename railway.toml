[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "web"
servicePlan = "free"
startCommand = "gunicorn staymatch.wsgi:application --workers 2 --threads 4 --worker-class sync --timeout 120 --bind 0.0.0.0:$PORT"

[[services]]
name = "worker"
servicePlan = "free"
startCommand = "celery -A staymatch worker --loglevel=info --concurrency=1"

[[services]]
name = "redis"
image = "redis:7-alpine"
servicePlan = "free"
